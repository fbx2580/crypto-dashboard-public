<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quant Research Lab</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#c9d1d9;--blue:#58a6ff;--green:#3fb950;--red:#f85149;--yellow:#d29922;--muted:#8b949e}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);padding:20px}
.w{max-width:1200px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{color:var(--blue);font-size:18px}.sub{color:var(--muted);font-size:11px}
.tabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:6px 14px;border:1px solid var(--border);border-radius:6px;font-size:12px;cursor:pointer;background:var(--card);color:var(--text);user-select:none}
.tab.on{color:#fff;border-color:var(--blue);background:#1a2a3a}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:14px}
h2{color:#f0f6fc;font-size:14px;margin-bottom:8px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.st{text-align:center;padding:10px;background:var(--bg);border-radius:6px;border:1px solid #21262d}
.st .v{font-size:20px;font-weight:bold;color:var(--blue)}.st .l{font-size:9px;color:var(--muted);margin-top:2px}.st.g .v{color:var(--green)}.st.r .v{color:var(--red)}.st.y .v{color:var(--yellow)}
.row{display:flex;gap:14px;flex-wrap:wrap}.col{flex:1;min-width:300px}
table{width:100%;border-collapse:collapse;font-size:11px}th,td{text-align:left;padding:4px 7px;border-bottom:1px solid #21262d}th{color:var(--muted);font-size:9px}
.up{color:var(--green)}.down{color:var(--red)}.no{color:var(--muted)}
.tag{display:inline-block;padding:1px 5px;border-radius:8px;font-size:8px}.tg-g{background:#1a3a2a;color:var(--green)}.tg-r{background:#3a1a1a;color:var(--red)}.tg-y{background:#3a2a1a;color:var(--yellow)}.tg-b{background:#1a2a3a;color:var(--blue)}
.loading{color:var(--muted);padding:20px;text-align:center}.nodata{color:var(--muted);padding:10px;text-align:center;font-size:11px;font-style:italic}
.refresh{font-size:10px;color:var(--blue);cursor:pointer;background:none;border:1px solid var(--border);padding:3px 10px;border-radius:4px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:3px}.ok{background:var(--green)}.bad{background:var(--red)}.warn{background:var(--yellow)}
.src{font-size:8px;color:var(--muted);text-align:right;margin-top:6px}
.ts{font-size:9px;color:var(--muted);text-align:right}
.feed{max-height:400px;overflow-y:auto}
.news-item{padding:3px 0;border-bottom:1px solid #21262d;font-size:11px}.news-item .time{color:var(--muted);font-size:10px}
</style>
</head>
<body>
<div class="w">
<div class="top">
<div><h1>🔬 Quant Research Lab</h1><p class="sub" id="ut">加载中...</p></div>
<button class="refresh" onclick="loadTab(currentTab)">刷新</button>
</div>

<div class="tabs">
<div class="tab on" data-tab="overview">🌐 首页</div>
<div class="tab" data-tab="market">🌐 市场环境</div>
<div class="tab" data-tab="scanner">📊 资产扫描</div>
<div class="tab" data-tab="funding">💰 资金</div>
<div class="tab" data-tab="news">📰 新闻</div>
<div class="tab" data-tab="alerts">⚡ 异动</div>
<div class="tab" data-tab="datacenter">🗄 数据中心</div>
</div>

<div id="overview" class="panel on"></div>
<div id="market" class="panel"></div>
<div id="scanner" class="panel"></div>
<div id="funding" class="panel"></div>
<div id="news" class="panel"></div>
<div id="alerts" class="panel"></div>
<div id="datacenter" class="panel"></div>
<div id="health"></div>
</div>

<script>
let currentTab='overview', cache={};
const F=(v,d=null)=>v!=null&&!isNaN(v)?v:d;
const P=(v,d=2)=>F(v)!==null?v.toFixed(d):null;
const PC=(v)=>v!=null?(v*100).toFixed(2):null;
const PF=(v,d=null)=>F(v)!==null?P(v,2)+'%':(d||null);
const T=(v)=>v?v.slice(0,19):null;

async function init(){
  const [mkt,scan,news,alerts,deriv,status]=await Promise.all([
    fetch('/api/market').then(r=>r.json()),
    fetch('/api/scan').then(r=>r.json()),
    fetch('/api/news').then(r=>r.json()),
    fetch('/api/alerts').then(r=>r.json()),
    fetch('/api/derivatives').then(r=>r.json()),
    fetch('/api/status').then(r=>r.json())
  ]);
  cache={mkt,scan,news,alerts,deriv,status};
  document.getElementById('ut').textContent='BTC $'+P(F(mkt.btc?.price),0)+' | '+new Date().toLocaleTimeString();
  loadTab(currentTab);
}

async function loadTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.tab===tab));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id===tab));
  if(!cache.mkt){await init();return;}
  const {mkt,scan,news,alerts,deriv,status}=cache;
  const b=mkt.btc||{},eb=mkt.ethbtc||{},dom=mkt.dominance||{};

  if(tab==='overview'){
    const tr=F(b.ret30d)>3?'BULL':F(b.ret30d)<-3?'BEAR':'SIDEWAYS';
    document.getElementById('overview').innerHTML=
    `<div class="row"><div class="col"><div class="card"><h2>🌐 Market Regime</h2><div class="g3">
      <div class="st ${tr==='BULL'?'g':tr==='BEAR'?'r':'y'}"><div class="v">${tr}</div><div class="l">BTC 趋势</div></div>
      <div class="st ${F(b.price)>F(b.ma200)?'g':'r'}"><div class="v">${F(b.price)>F(b.ma200)?'上方':'下方'}</div><div class="l">vs MA200</div></div>
      <div class="st"><div class="v">${F(dom.btc)>60?'BTC主导':'中性'}</div><div class="l">山寨状态</div></div>
      <div class="st ${F(dom.btc)>65?'r':'g'}"><div class="v">${F(dom.btc)>65?'高':'中'}</div><div class="l">风险等级</div></div>
    </div><div class="ts">更新: ${T(mkt.updatedAt)||'—'}</div></div></div></div>
    <div class="row"><div class="col"><div class="card"><h2>🪙 BTC</h2><div class="g2">
      <div class="st"><div class="v">$${P(F(b.price),0)}</div><div class="l">价格</div></div>
      <div class="st ${F(b.change24h)>0?'g':'r'}"><div class="v">${PF(b.change24h)||'—'}</div><div class="l">24h涨跌</div></div>
      <div class="st"><div class="v">$${P(F(b.ma200),0)}</div><div class="l">MA200</div></div>
      <div class="st ${F(b.ret30d)>0?'g':'r'}"><div class="v">${PF(b.ret30d)||'—'}</div><div class="l">30d</div></div>
      <div class="st"><div class="v">${F(b.volatility)?P(b.volatility*100,0)+'%':'—'}</div><div class="l">波动率</div></div>
      <div class="st"><div class="v">${F(b.volume24h)?'$'+P(b.volume24h/1e6,0)+'M':'—'}</div><div class="l">24h量</div></div>
    </div><div class="src">来源: ${b.source||'Binance'} | ${T(b.updatedAt)||'—'}</div></div></div>
    <div class="col"><div class="card"><h2>🏔 山寨</h2><div class="g2">
      <div class="st"><div class="v">${P(F(dom.btc),1)}%</div><div class="l">BTC.D</div></div>
      <div class="st"><div class="v">${P(F(eb.price),5)}</div><div class="l">ETH/BTC</div></div>
      <div class="st"><div class="v">$${F(mkt.totalMC)?P(mkt.totalMC/1e12,2)+'T':'—'}</div><div class="l">总市值</div></div>
      <div class="st"><div class="v">${mkt.total3?.status||'—'}</div><div class="l">TOTAL3</div></div>
    </div><div class="src">BTC.D: CoinGecko | ETH/BTC: Binance</div></div></div></div>`;
    document.getElementById('health').innerHTML=`<div class="card"><h2>💚 Data Health</h2><div style="display:flex;gap:16px;flex-wrap:wrap;font-size:11px">${(status.checks||[]).map(c=>`<div><span class="dot ${c.ok?'ok':'bad'}"></span> ${c.name}: ${c.ok?'正常':'⚠️'}</div>`).join('')}</div><div class="ts" style="margin-top:6px">Last Sync: ${new Date().toLocaleTimeString()}</div></div>`;
  }

  if(tab==='market'){
    try{
      const rg=await fetch('/api/regime').then(r=>r.json());
      if(rg.error){document.getElementById('market').innerHTML='<p class="nodata">'+rg.error+'</p>';return;}
      const bc=rg.btc||{},ac=rg.altcoin||{},rk=rg.risk||{};
      const stColor=bc.state==='BULL'?'g':bc.state==='BEAR'?'r':'y';
      document.getElementById('market').innerHTML=
      '<div class="row"><div class="col"><div class="card"><h2>🪙 BTC 环境</h2><div class="g2">'+
      '<div class="st"><div class="v">$'+P(F(bc.price),0)+'</div><div class="l">价格</div></div>'+
      '<div class="st '+stColor+'"><div class="v">'+bc.state+'</div><div class="l">状态</div></div>'+
      '<div class="st '+(bc.vsMA200?.class==='up'?'g':'r')+'"><div class="v">'+bc.vsMA200?.label+'</div><div class="l">MA200 '+bc.vsMA200?.distance+'</div></div>'+
      '<div class="st '+(bc.trend?.class==='up'?'g':bc.trend?.class==='down'?'r':'y')+'"><div class="v">'+bc.trend?.label+'</div><div class="l">30d趋势</div></div>'+
      '<div class="st '+(bc.volatility?.class==='low'?'g':bc.volatility?.class==='high'?'r':'y')+'"><div class="v">'+bc.volatility?.label+'</div><div class="l">波动 '+bc.volatility?.value+'</div></div>'+
      '</div><div class="src">来源: '+rg.sources?.btc+' | 更新: '+T(rg.updatedAt)+'</div></div></div>'+
      '<div class="col"><div class="card"><h2>🏔 山寨环境</h2><div class="g2">'+
      '<div class="st '+(ac.state==='ALT_SEASON'?'g':ac.state==='BTC_SEASON'?'r':'y')+'"><div class="v">'+(ac.state==='BTC_SEASON'?'BTC主导':ac.state==='ALT_SEASON'?'山寨季':'中性')+'</div><div class="l">状态</div></div>'+
      '<div class="st"><div class="v">'+P(F(ac.btcDominance),1)+'%</div><div class="l">BTC.D</div></div>'+
      '<div class="st '+(ac.ethbtcTrend==='走强'?'g':'r')+'"><div class="v">'+ac.ethbtcTrend+'</div><div class="l">ETH/BTC 30d</div></div>'+
      '<div class="st"><div class="v">'+(F(ac.totalMC)?'$'+P(ac.totalMC/1e12,2)+'T':'—')+'</div><div class="l">总市值</div></div>'+
      '</div><div class="src">来源: '+rg.sources?.alt+' / '+rg.sources?.ethbtc+'</div></div></div></div>'+
      '<div class="card"><h2>⚠️ 风险因素</h2><div class="g2"><div class="st '+(rk.level==='HIGH'?'r':rk.level==='MEDIUM'?'y':'g')+'"><div class="v">'+rk.level+'</div><div class="l">风险等级</div></div></div>'+
      '<div style="font-size:11px;margin-top:8px;color:var(--muted)">'+((rk.factors||[]).length?rk.factors.map(f=>'• '+f).join('<br>'):'无明显风险因素')+'</div></div>';
    }catch(e){document.getElementById('market').innerHTML='<p class="loading">加载失败</p>';}
  }

  if(tab==='scanner'){/* ... same scanner code ... */}

  if(tab==='funding'){
    const items=deriv.items||[],s=deriv.summary||{};
    document.getElementById('funding').innerHTML='<div class="card"><h2>💰 资金费率</h2><div class="g2"><div class="st"><div class="v">'+PC(s.avgFunding)||'—'+'</div><div class="l">均费率</div></div><div class="st g"><div class="v">'+(s.positiveCount||0)+'</div><div class="l">正费率</div></div><div class="st r"><div class="v">'+(s.negativeCount||0)+'</div><div class="l">负费率</div></div><div class="st y"><div class="v">'+(s.extremeCount||0)+'</div><div class="l">极端>0.5%</div></div></div></div><div class="card"><h2>Top 合约</h2><table><tr><th>币种</th><th>价格</th><th>24h量</th><th>涨跌</th><th>费率</th></tr>'+items.map(c=>'<tr><td>'+c.symbol+'</td><td>$'+P(c.price,4)+'</td><td>$'+P(c.volume24h/1e6,0)+'M</td><td class="'+(c.change24h>0?'up':'down')+'">'+P(c.change24h,1)+'%</td><td>'+PC(c.fundingRate)||'—'+'</td></tr>').join('')+'</table></div>';
  }
  if(tab==='news'){
    const items=news.items||[];
    document.getElementById('news').innerHTML='<div class="card"><h2>📰 新闻</h2><div class="feed">'+(items.length?items.map(n=>'<div class="news-item"><span class="time">'+(n.time||'').slice(0,16)+'</span> '+n.title+'</div>').join(''):'<p class="nodata">暂无新闻</p>')+'</div></div>';
  }
  if(tab==='alerts'){
    const items=alerts.items||[];
    document.getElementById('alerts').innerHTML='<div class="card"><h2>⚡ 异动</h2>'+(items.length?('<table><tr><th>币种</th><th>时间</th><th>涨跌</th><th>等级</th></tr>'+items.map(a=>'<tr><td>'+(a.symbol||'—')+'</td><td>'+(a.time||'').slice(11,19)+'</td><td class="'+(a.change>0?'up':'down')+'">'+P(a.change,1)+'%</td><td><span class="tag '+(a.level==='大'?'tg-r':'tg-y')+'">'+a.level+'</span></td></tr>').join('')+'</table>'):'<p class="nodata">暂无异动</p>')+'</div>';
  }
  if(tab==='datacenter'){
    try{
      const [dc,dq]=await Promise.all([
        fetch('/api/datacenter').then(r=>r.json()),
        fetch('/api/data-quality').then(r=>r.json())
      ]);
      const srcs=(dc.sources||[]).map(s=>'<div><span class="dot '+(s.ok?'ok':'bad')+'"></span> <b>'+s.name+'</b>: '+(s.ok?'✅正常':'⚠️异常')+' | 频率:'+s.lastSync+' | '+s.volume+'</div>').join('');
      const cv=dc.coverage||{};
      const storage=(dc.storage||[]).map(s=>'<tr><td>'+s.dir+'</td><td>'+s.files+'</td><td>'+s.size+'</td><td>'+s.updated+'</td></tr>').join('');
      const fields=Object.entries(dc.fields||{}).map(([k,v])=>'<div style="margin-bottom:8px"><b>'+k+':</b> <span style="color:var(--muted);font-size:10px">'+v.join(', ')+'</span></div>').join('');
      const healthScore=()=>{const ok=dc.sources.filter(s=>s.ok).length;const total=dc.sources.length;const covPct=parseInt(cv.kline?.pct||'0');const avg=(ok/total*100+covPct)/2;return avg.toFixed(0)+'%';};
      document.getElementById('datacenter').innerHTML=
        // Data Quality
        '<div class="card"><h2>💚 Data Quality</h2>'+
        '<div class="g3">'+
        '<div class="st '+(dq.overall_score>=80?'g':dq.overall_score>=60?'y':'r')+'"><div class="v">'+dq.overall_score+'%</div><div class="l">综合评分</div></div>'+
        '<div class="st '+(dq.status==='healthy'?'g':'r')+'"><div class="v">'+dq.status?.toUpperCase()+'</div><div class="l">状态</div></div>'+
        '</div>'+
        '<div style="font-size:11px;margin-top:8px">'+
        Object.entries(dq.checks||{}).map(([k,v])=>'<div style="margin:2px 0"><span style="color:'+(v.status==='ok'?'var(--green)':v.status==='warn'?'var(--yellow)':'var(--red)')+'">'+(v.status==='ok'?'✅':v.status==='warn'?'⚠️':'❌')+'</span> '+k+': '+v.score+'%'+(v.errors?.length?' <span style="color:var(--red);font-size:9px">('+v.errors.length+'个问题)</span>':'')+'</div>').join('')+
        '</div></div>'+
        // Data Sources
        '<div class="card"><h2>📡 Data Sources</h2><div style="font-size:11px;line-height:1.8">'+srcs+'</div></div>'+
        '<div class="card"><h2>📊 K-line Coverage</h2>'+
          '<div class="g2"><div class="st"><div class="v">'+(cv.kline?.cached||0)+'</div><div class="l">已缓存</div></div><div class="st"><div class="v">'+(cv.kline?.target||528)+'</div><div class="l">目标</div></div><div class="st '+(parseInt(cv.kline?.pct)>70?'g':'y')+'"><div class="v">'+(cv.kline?.pct||'0%')+'</div><div class="l">覆盖率</div></div><div class="st"><div class="v">'+(cv.kline?.missing||0)+'</div><div class="l">缺失</div></div></div>'+
          '<div class="ts" style="margin-top:8px">周期: '+((cv.periods||['1d']).join(', '))+' | 最早同步: '+(cv.oldestSync||'—')+'</div></div>'+
        '<div class="card"><h2>💾 Storage</h2><table><tr><th>目录</th><th>文件数</th><th>大小</th><th>最新更新</th></tr>'+storage+'</table></div>'+
        '<div class="card"><h2>📋 字段字典</h2>'+fields+'</div>'+
        '<div class="card"><h2>💚 Data Health Score</h2><div style="text-align:center;font-size:32px;font-weight:bold;color:'+(parseInt(healthScore())>70?'var(--green)':'var(--yellow)')+'">'+healthScore()+'</div><div class="ts" style="text-align:center">API 可用性 + K线覆盖率</div></div>';
    }catch(e){document.getElementById('datacenter').innerHTML='<p class="loading">加载失败</p>';}
  }
}

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>loadTab(t.dataset.tab));
init();
</script>
</body>
</html>
