<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>监控面板</title>
<style>
:root{--bg:#0a0f18;--card:#111827;--border:#1e293b;--text:#e2e8f0;--muted:#64748b;--blue:#60a5fa;--green:#4ade80;--red:#f87171;--yellow:#fbbf24;--cyan:#22d3ee}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);padding:10px;font-size:11px}
.w{max-width:1300px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);margin-bottom:8px}
.top h1{font-size:14px;color:var(--cyan)}.top .live{font-size:10px;color:var(--muted)}.top .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:4px;animation:pulse 2s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.g{display:grid;grid-template-columns:220px 1fr;gap:8px}
.card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:8px}
.card h3{font-size:11px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
/* 进程 */
.proc{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid #1a2235}.proc:last-child{border:0}
.proc .s{width:8px;height:8px;border-radius:50%;flex-shrink:0}.proc .s.ok{background:var(--green)}.proc .s.bad{background:var(--red);animation:pulse 1s infinite}
.proc .info{flex:1}.proc .name{font-weight:bold}.proc .meta{font-size:9px;color:var(--muted)}
/* 新鲜度 */
.fbar{margin-bottom:4px}.fbar .label{display:flex;justify-content:space-between;font-size:10px}.fbar .label span:last-child{color:var(--muted)}
.fbar .track{height:4px;background:#1e293b;border-radius:2px;margin:2px 0;overflow:hidden}
.fbar .fill{height:100%;border-radius:2px;transition:width .5s}.fill.ok{background:var(--green)}.fill.warn{background:var(--yellow)}.fill.bad{background:var(--red)}
/* 质量 */
.qgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.qb{text-align:center;padding:5px;border-radius:4px;font-size:10px}.qb .n{font-size:9px;color:var(--muted)}.qb .v{font-size:16px;font-weight:bold}
/* 告警 */
.alert{font-size:10px;padding:3px 0;border-bottom:1px solid #1a2235}.alert:last-child{border:0}
.alert.p0{border-left:2px solid var(--red);padding-left:6px}.alert.p1{border-left:2px solid var(--yellow);padding-left:6px}
/* 数据量 */
.dv{display:flex;gap:8px;flex-wrap:wrap}.dv-item{font-size:10px;padding:3px 6px;border-radius:3px;background:#1a2235}
/* 右列 */
.right{display:flex;flex-direction:column;gap:8px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>
<div class="w">
<div class="top">
<h1>🛡 实时监控</h1>
<div class="live"><span class="dot"></span>5s 自刷新 · <span id="clock">--</span></div>
</div>

<div class="g">
  <!-- 左列 -->
  <div>
    <div class="card"><h3>进程</h3><div id="procs">加载...</div></div>
    <div class="card" style="margin-top:8px"><h3>告警</h3><div id="alerts">加载...</div></div>
    <div class="card" style="margin-top:8px"><h3>数据量</h3><div class="dv" id="datavol">加载...</div></div>
  </div>

  <!-- 右列 -->
  <div class="right">
    <div class="card"><h3>数据新鲜度</h3><div id="fresh">加载...</div></div>
    <div class="card"><h3>数据质量</h3><div class="qgrid" id="quality">加载...</div></div>
    <div class="card"><h3>数据源健康</h3><div id="health">加载...</div></div>
    <div class="r2">
      <div class="card"><h3>K线覆盖</h3><div id="kline">加载...</div></div>
      <div class="card"><h3>归档</h3><div id="archive">加载...</div></div>
    </div>
  </div>
</div>
</div>

<script>
async function tick(){
  const t0=performance.now();
  try {
    const [mon,dq,dc]=await Promise.all([
      fetch('/api/monitor').then(r=>r.json()),
      fetch('/api/data-quality').then(r=>r.json()),
      fetch('/api/datacenter').then(r=>r.json()).catch(()=>({coverage:{},sources:[],archive:{}}))
    ]);
    const ms=Math.round(performance.now()-t0);
    document.getElementById('clock').textContent=new Date().toLocaleTimeString()+` (${ms}ms)`;

    // ── 进程 ──
    document.getElementById('procs').innerHTML=(mon.procs||[]).map(p=>{
      const ok=p.status==='alive';
      return `<div class="proc"><div class="s ${ok?'ok':'bad'}"></div><div class="info"><div class="name">${p.name}</div><div class="meta">${ok?'PID:'+p.pid+' ↑'+p.uptime:'❌ 挂了'}</div></div></div>`;
    }).join('');

    // ── 新鲜度 ──
    document.getElementById('fresh').innerHTML=(mon.freshness||[]).map(f=>{
      const max=f.status==='fresh'?30:f.status==='stale'?180:600;
      const pct=Math.min(100,(f.delay||0)/max*100);
      const cls=f.status==='fresh'?'ok':f.status==='stale'?'warn':'bad';
      return `<div class="fbar"><div class="label"><span>${f.name}</span><span style="color:${f.status==='fresh'?'var(--green)':f.status==='stale'?'var(--yellow)':'var(--red)'}">${f.delay!=null?f.delay+'s':'缺'}</span></div><div class="track"><div class="fill ${cls}" style="width:${pct}%"></div></div></div>`;
    }).join('');

    // ── 质量 ──
    const checks=dq.checks||{};
    const qNames={jin10:'金十',rss:'RSS',whale:'鲸鱼',eth:'ETH',alerts:'异动',market_snapshot:'快照',data_quality:'质量',alerts_log:'告警'};
    document.getElementById('quality').innerHTML=Object.entries(checks).map(([k,v])=>{
      const c=v.score>=80?'var(--green)':v.score>=50?'var(--yellow)':'var(--red)';
      const name=qNames[k]||k;
      const hint=v.verified?` title="${v.verifyResult||''}"`:'';
      return `<div class="qb" style="border:1px solid #1e293b;cursor:help"${hint}><div class="v" style="color:${c}">${v.score}%</div><div class="n">${name}</div>${v.errors?.length?`<div style="font-size:7px;color:var(--red)">${v.errors.length}个问题</div>`:''}</div>`;
    }).join('');

    // ── 告警 ──
    const alerts=(dq.alerts||[]).filter(a=>!a.resolved);
    document.getElementById('alerts').innerHTML=alerts.length
      ? alerts.slice(0,5).map(a=>{
        const cls=a.level==='critical'?'p0':'p1';
        const errs=(a.errors||[]).filter(Boolean);
        return `<div class="alert ${cls}"><div style="font-weight:bold">${a.level==='critical'?'🔴':'⚠️'} ${a.message}</div><div style="font-size:9px;color:var(--muted)">${new Date(a.time).toLocaleTimeString()}</div>${errs.length?`<div style="font-size:9px;color:var(--red);margin-top:3px;padding-left:8px">${errs.map(e=>'· '+e).join('<br>')}</div>`:''}</div>`;
      }).join('')
      : '<div style="color:var(--green);font-size:10px">✅ 无告警</div>';

    // ── 数据源健康 ──
    document.getElementById('health').innerHTML=(dc.sources||[]).map(s=>
      `<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:10px;border-bottom:1px solid #1a2235"><span>${s.ok?'🟢':'🔴'} ${s.name}</span><span style="color:var(--muted)">${s.lastSync}</span></div>`
    ).join('');

    // ── K线 ──
    const cv=dc.coverage?.kline||{};
    const kpct=parseInt(cv.pct)||0;
    document.getElementById('kline').innerHTML=`
      <div style="text-align:center;font-size:22px;font-weight:bold;color:${kpct>70?'var(--green)':kpct>40?'var(--yellow)':'var(--red)'}">${kpct}%</div>
      <div style="text-align:center;font-size:10px;color:var(--muted)">${cv.cached||0} / ${cv.target||528} 币</div>
    `;

    // ── 归档 ──
    const a=mon.archive||{};
    document.getElementById('archive').innerHTML=Object.keys(a).length
      ? Object.entries(a).slice(0,4).map(([k,v])=>`<div style="display:flex;justify-content:space-between;padding:2px 0;font-size:10px"><span style="color:var(--cyan)">${k}</span><span style="color:var(--muted)">${v.total}条 / ${v.files}天</span></div>`).join('')
      : '<div style="color:var(--muted);font-size:10px">等待归档...</div>';

    // ── 数据量（直播 + 归档）──
    const vol=mon.volumes||{};
    const arc=mon.archVolumes||{};
    document.getElementById('datavol').innerHTML=
      `<div class="dv-item">📰 金十 <b>${vol.jin10||'?'}</b>条${arc.news?' +📦'+arc.news+'':''}</div>`+
      `<div class="dv-item">📡 RSS <b>${vol.rss||'?'}</b>条${arc.news?' +📦'+arc.news+'':''}</div>`+
      `<div class="dv-item">🐋 鲸鱼 <b>${vol.whale||'?'}</b>条${arc.whale?' +📦'+arc.whale+'':''}</div>`+
      `<div class="dv-item">💹 ETH <b>${vol.eth||'?'}</b>大户</div>`+
      `<div class="dv-item">⚡ 异动 <b>${vol.alerts||'?'}</b>条${arc.alerts?' +📦'+arc.alerts+'':''}</div>`;

  } catch(e) {
    document.getElementById('procs').innerHTML='<span style="color:var(--red)">⚠️ API 不可达</span>';
  }
}
tick(); setInterval(tick,5000);
</script>
</body>
</html>
