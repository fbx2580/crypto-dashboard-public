<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>K线测试</title></head>
<body style="background:#000;padding:20px;">
<div id="chart" style="width:800px;height:400px;"></div>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
try {
  const chart = LightweightCharts.createChart(document.getElementById('chart'), {
    layout: { background:{color:'#0a0a0a'}, textColor:'#00cc44' },
    grid: { vertLines:{color:'#002200'}, horzLines:{color:'#002200'} },
  });
  const series = chart.addCandlestickSeries({
    upColor:'#00ff00', downColor:'#ff3333', borderDownColor:'#ff3333', borderUpColor:'#00ff00',
  });
  // 模拟数据
  const data = [];
  let t = Math.floor(Date.now()/1000) - 86400;
  let p = 65000;
  for (let i = 0; i < 100; i++) {
    p += (Math.random() - 0.5) * 200;
    data.push({ time: t + i * 3600, open: p, high: p + Math.random()*100, low: p - Math.random()*100, close: p + (Math.random()-0.5)*50 });
  }
  series.setData(data);
  chart.timeScale().fitContent();
  document.body.innerHTML += '<p style="color:#0f0">✅ Chart rendered: ' + data.length + ' candles</p>';
} catch(e) {
  document.body.innerHTML += '<p style="color:#f00">❌ Error: ' + e.message + '</p>';
}
</script>
</body>
</html>
